<title>Plano Financeiro</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --elev:#ffffff;
  --label:#000000; --label2:rgba(60,60,67,.64); --label3:rgba(60,60,67,.38);
  --sep:rgba(60,60,67,.2); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007aff; --blue-tint:rgba(0,122,255,.12);
  --pos:#248a3d; --neg:#d70015; --warn-t:#b25000;
  --green-f:#34c759; --red-f:#ff3b30; --orange-f:#ff9500;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:rgba(60,60,67,.12); --axis:rgba(60,60,67,.55);
  --good:#0ca30c; --crit:#d03b3b; --warnc:#fab219;
  --tab:rgba(249,249,249,.88); --scrim:rgba(0,0,0,.32);
  --r-card:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --elev:#2c2c2e;
    --label:#ffffff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
    --sep:rgba(84,84,88,.62); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
    --blue:#0a84ff; --blue-tint:rgba(10,132,255,.2);
    --pos:#30d158; --neg:#ff453a; --warn-t:#ff9f0a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:rgba(235,235,245,.1); --axis:rgba(235,235,245,.55);
    --tab:rgba(24,24,26,.88); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --elev:#2c2c2e;
  --label:#ffffff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --sep:rgba(84,84,88,.62); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --blue:#0a84ff; --blue-tint:rgba(10,132,255,.2);
  --pos:#30d158; --neg:#ff453a; --warn-t:#ff9f0a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:rgba(235,235,245,.1); --axis:rgba(235,235,245,.55);
  --tab:rgba(24,24,26,.88); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--label);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.lt{padding-top:14px;padding-bottom:6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance}
.lt .sub{color:var(--label2);font-size:15px;margin-top:2px}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-inline:-16px;padding-inline:8px;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.navbar .back{justify-self:start;background:none;border:0;color:var(--blue);font-size:17px;padding:8px;display:flex;align-items:center;gap:2px}
.navbar .ttl{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.circle-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;flex:none}
.circle-btn svg{width:18px;height:18px}
section{margin-top:22px}
.gh{font-size:13px;font-weight:400;color:var(--label2);text-transform:uppercase;letter-spacing:.4px;margin:0 16px 7px;display:flex;justify-content:space-between;gap:8px}
.gh a,.gh button{text-transform:none;letter-spacing:0;color:var(--blue);background:none;border:0;font-size:15px;padding:0}
.gf{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;position:relative;background:none;border:0;width:100%;text-align:left}
.row+.row::before,.row+.rowx::before,.rowx+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ic+.row::before,.row+.row.ic::before{left:58px}
button.row:active,.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:anywhere}
.row .d{font-size:13px;color:var(--label2);margin-top:1px;overflow-wrap:anywhere}
.row .v{font-size:17px;text-align:right;white-space:nowrap}
.row .vd{font-size:13px;color:var(--label2);text-align:right;white-space:nowrap}
.chev{color:var(--label3);flex:none;width:8px;height:14px}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--fill)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--label2)} .warn{color:var(--warn-t)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--label2);white-space:nowrap}
.pill.ok{background:rgba(52,199,89,.16);color:var(--pos)}
.pill.bad{background:rgba(255,59,48,.14);color:var(--neg)}
.pill.att{background:rgba(255,149,0,.16);color:var(--warn-t)}
.pill.info{background:var(--blue-tint);color:var(--blue)}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;background:none;padding:0}
.check.on{background:var(--green-f);border-color:var(--green-f)}
.check.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hero{background:var(--card);border-radius:16px;padding:18px 18px 16px}

.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar>i.over{background:var(--red-f)}
.bar>i.good{background:var(--green-f)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:var(--r-card);padding:12px 14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left}
.tile .k{font-size:13px;color:var(--label2);font-weight:500}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.2px;margin-top:6px}
.tile .s{font-size:12px;color:var(--label2);margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:17px;padding:0 16px}
.btn.tint{background:var(--blue-tint);color:var(--blue)}
.btn.danger{background:rgba(255,59,48,.14);color:var(--neg)}
.btn.sm{min-height:36px;font-size:15px;width:auto;border-radius:18px;padding:0 14px}
.btn:disabled{opacity:.45}
.btns{display:grid;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:500;min-height:30px;white-space:nowrap}
.seg button.on{background:var(--elev);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.mswitch{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:var(--r-card);padding:4px}
.mswitch button{background:none;border:0;color:var(--blue);width:44px;height:40px;border-radius:10px;display:grid;place-items:center}

.mswitch .m{font-weight:600;font-size:17px}
.chart-card{background:var(--card);border-radius:var(--r-card);padding:14px 12px 10px}
.chart-card h4{margin:0 4px 2px;font-size:15px;font-weight:600}
.chart-card .cs{margin:0 4px 8px;font-size:13px;color:var(--label2)}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .g{stroke:var(--grid);stroke-width:1}
.chart .g0{stroke:var(--axis);stroke-width:1}
.chart .yt,.chart .xt{fill:var(--label2);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lbl{fill:var(--label);font-size:11px;font-weight:600}
.chart .xh{stroke:var(--label3);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--elev);color:var(--label);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);min-width:130px;z-index:3;line-height:1.45}
.tip b{display:block;font-size:12px;margin-bottom:2px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:5px;color:var(--label2)}
.sw-dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.sw-line{width:14px;height:0;border-top:2px solid;display:inline-block;flex:none}
.sw-dash{width:14px;height:0;border-top:2px dashed;display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 4px 0;font-size:12px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r-card)}
table.t{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:.5px solid var(--sep)}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
table.t thead th{color:var(--label2);font-weight:500;font-size:12px}
table.t tr.tot td{font-weight:700}
table.t tr:last-child td{border-bottom:0}
table.t tr.cur td{background:var(--blue-tint)}
table.t tr.cur td:first-child{background:color-mix(in srgb,var(--card),var(--blue) 12%)}
.catbar{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:8px 16px}
.catbar .nm{font-size:15px}
.catbar .tr2{grid-column:2/4;height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.catbar .tr2 i{display:block;height:100%;background:var(--s1);border-radius:99px}
.note{background:var(--card);border-radius:var(--r-card);padding:12px 16px;font-size:15px;color:var(--label2);line-height:1.45}
.note b{color:var(--label)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:var(--r-card);padding:12px 14px;font-size:15px;line-height:1.4}
.alert .dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.alert.crit .dot{background:var(--crit)} .alert.warn .dot{background:var(--warnc);color:#000} .alert.good .dot{background:var(--good)} .alert.info .dot{background:var(--blue)}
.alerts{display:grid;gap:8px}
.banner{margin-top:12px;background:var(--blue-tint);color:var(--label);border-radius:var(--r-card);padding:10px 14px;font-size:14px;line-height:1.4}
.empty{text-align:center;color:var(--label2);padding:28px 16px;font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--label2);font-size:10px;font-weight:500}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--blue)}
#sheet{position:fixed;inset:0;z-index:50}
#sheet .sh-bg{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
#sheet .sh-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open .sh-bg{opacity:1}
#sheet.open .sh-panel{transform:none}
.sh-grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px 8px}
.sh-head .sh-t{font-weight:600;font-size:17px;text-align:center}
.sh-head button{background:none;border:0;color:var(--blue);font-size:17px;padding:8px}
.sh-head .sh-ok{justify-self:end;font-weight:600}
.sh-body{overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.fg{background:var(--card);border-radius:var(--r-card);overflow:hidden;margin-top:14px}
.f{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:48px;position:relative}
.f+.f::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.f label{flex:none;font-size:17px;min-width:110px}
.f .in{flex:1;min-width:0;border:0;background:none;padding:12px 0;text-align:right;font-size:17px;outline:none}
.f select.in{appearance:none;-webkit-appearance:none;direction:rtl;color:var(--label2)}
.f textarea.in{text-align:left;min-height:90px;resize:vertical}
.f.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.f.col label{font-size:13px;color:var(--label2)}
.f.col .in{text-align:left}
.fh{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.4}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:14px 0 4px}
.amount span{font-size:28px;color:var(--label2);font-weight:600}
.amount input{border:0;background:none;font-size:48px;font-weight:700;width:100%;max-width:280px;text-align:center;outline:none;letter-spacing:-.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.chip{border:0;background:var(--fill);border-radius:999px;padding:7px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--blue);color:#fff}
.sw{position:relative;display:inline-block;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--fill2);border-radius:99px;transition:background .2s}
.sw span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--green-f)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--elev);color:var(--label);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.calc-out{background:var(--card);border-radius:var(--r-card);padding:14px 16px;margin-top:14px}
.calc-out .k{font-size:13px;color:var(--label2)}
.calc-out .big{font-size:30px;font-weight:700;margin:2px 0 6px}
.calc-out p{margin:6px 0 0;font-size:15px;color:var(--label2);line-height:1.45}
.prose{background:var(--card);border-radius:var(--r-card);padding:14px 16px;font-size:16px;line-height:1.5}
.prose h3{font-size:17px;margin:16px 0 4px}
.prose h3:first-child{margin-top:0}
.prose p,.prose li{color:var(--label2);max-width:65ch}
.prose p{margin:4px 0 8px}
.prose ol,.prose ul{padding-left:20px;margin:4px 0 8px}
.prose b{color:var(--label)}
.dl{display:grid;gap:0}
.dl .row .t{font-weight:600}
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 24px calc(env(safe-area-inset-bottom,0px) + 20px)}
.onb .skip{align-self:flex-end;background:none;border:0;color:var(--blue);font-size:17px;padding:8px}
.onb .pg{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;margin:0 auto;width:100%}
.onb .art{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;margin-bottom:24px;color:#fff}
.onb .art svg{width:52px;height:52px}
.onb h2{font-size:30px;line-height:1.15;margin:0 0 12px;text-wrap:balance}
.onb p{font-size:17px;color:var(--label2);line-height:1.5;margin:0 0 10px}
.onb .dots{display:flex;gap:8px;justify-content:center;margin:18px 0}
.onb .dots i{width:8px;height:8px;border-radius:50%;background:var(--label3)}
.onb .dots i.on{background:var(--label)}
.onb .foot{max-width:520px;margin:0 auto;width:100%}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--label2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.hero .big{font-size:38px}.tile .v{font-size:19px}}
</style>

<div class="app" id="app"><div class="loading">Carregando…</div></div>
<div class="tabbar" id="tabbar"></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="onb" hidden></div>

<script>
"use strict";
/* ===================== utilidades ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fmt = v => BRL.format(Math.abs(v) < 0.005 ? 0 : (v || 0));
const fmt0 = v => { const r = Math.round(v || 0); return (r < 0 ? '−' : '') + 'R$ ' + Math.abs(r).toLocaleString('pt-BR'); };
const fmtS = v => (v > 0.004 ? '+' : '') + fmt(v);
const pc = (v, d = 1) => ((v || 0) * 100).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}) + '%';
const nf = (v, d = 2) => (v || 0).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const COMPACT = new Intl.NumberFormat('pt-BR', {notation:'compact', maximumFractionDigits:1});
const kfmt = v => COMPACT.format(v);
function parseMoney(s){
  if (typeof s === 'number') return s;
  s = String(s || '').trim().replace(/R\$|\s|%/g, '').replace('−', '-');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return Number(s);
}
const moneyIn = v => (v == null || v === '' || isNaN(v)) ? '' : nf(+v, 2);
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (+f(x) || 0), 0);
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DOWS = ['dom','seg','ter','qua','qui','sex','sáb'];
const ymOf = d => String(d).slice(0, 7);
function ymAdd(ym, n){ let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(m); }
function ymDiff(a, b){ const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
const ymLabel = ym => MES[+ym.slice(5) - 1] + '/' + ym.slice(2, 4);
const ymLong = ym => MESL[+ym.slice(5) - 1] + ' de ' + ym.slice(0, 4);
function daysIn(ym){ const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function dParse(s){ const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function dFmt(t){ const d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
const dAdd = (s, n) => dFmt(dParse(s) + n * 864e5);
const dDiff = (a, b) => Math.round((dParse(b) - dParse(a)) / 864e5);
const dLabel = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const dLabelY = s => s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4);
const dow = s => new Date(dParse(s)).getUTCDay();
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const ymd = (ym, day) => ym + '-' + pad(Math.max(1, Math.min(+day || 1, daysIn(ym))));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o == null ? {} : o));
const isSet = v => v != null && v !== '' && !(typeof v === 'number' && isNaN(v));

const COLS = ['cfg','fixas','recorrentes','anuais','extras','diario','meses','receb','pend'];
const S = {mode:'loading', data:Object.fromEntries(COLS.map(c => [c, {}])), db:null, ready:false, err:null};
const LS_KEY = 'plano-financeiro-v1';
function lsLoad(){ try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (j) for (const c of COLS) S.data[c] = j[c] || {}; } catch (e) {} }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S.data)); } catch (e) {} }
const writeChains = {};
function queued(key, fn){ const p = (writeChains[key] || Promise.resolve()).catch(() => {}).then(fn); writeChains[key] = p; return p; }
function dbErr(e){
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('Limite de registros atingido. Apague lançamentos antigos.');
  else if (code === 'invalid_argument') toast('Sem permissão para salvar aqui.');
  else toast('Não foi possível salvar. Tente de novo.');
  console.warn(e);
}
async function put(c, id, data){
  S.data[c] = Object.assign({}, S.data[c], {[id]: data});
  scheduleRender();
  if (S.mode === 'db') {
    try { await queued(c + '/' + id, () => S.db.collection(c).doc(id).set(data)); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await S.db.collection(c).doc(id).set(data); } catch (e2) { dbErr(e2); } } else dbErr(e); }
  } else lsSave();
}
async function del(c, id){
  const m = Object.assign({}, S.data[c]); delete m[id]; S.data[c] = m; scheduleRender();
  if (S.mode === 'db') { try { await queued(c + '/' + id, () => S.db.collection(c).doc(id).delete()); } catch (e) { dbErr(e); } }
  else lsSave();
}
function C(){
  const c = Object.assign({}, DEFAULT_CFG, S.data.cfg.main || {});
  c.receb = Object.assign({}, DEFAULT_CFG.receb, c.receb || {});
  c.cenarios = Object.assign({}, DEFAULT_CFG.cenarios, c.cenarios || {});
  c.placa = Object.assign({}, DEFAULT_CFG.placa, c.placa || {});
  if (!Array.isArray(c.categorias) || !c.categorias.length) c.categorias = DEFAULT_CATS;
  if (!Array.isArray(c.cartoes)) c.cartoes = [];
  return c;
}
const hasCfg = () => !!S.data.cfg.main;
function saveCfg(patch){ return put('cfg', 'main', Object.assign(clone(C()), patch)); }
function putMes(ym, fn){ const m = clone(S.data.meses[ym] || {}); fn(m); return put('meses', ym, m); }

async function initStore(){
  let db = null;
  try { db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { S.mode = 'local'; lsLoad(); S.ready = true; scheduleRender(); maybeOnboard(); return; }
  S.db = db; S.mode = 'db';
  const pending = new Set(COLS);
  const done = c => { if (pending.delete(c) && !pending.size) { S.ready = true; maybeOnboard(); } scheduleRender(); };
  for (const c of COLS) {
    try {
      db.collection(c).onSnapshot(snap => {
        const m = {}; for (const d of snap.docs) m[d.id] = d.data(); S.data[c] = m; done(c);
      }, err => { S.err = err && err.code; console.warn(c, err); done(c); });
    } catch (e) { console.warn(e); done(c); }
  }
}

/* ===================== motor de cálculo ===================== */
const PAGS_FIXOS = [{id:'debito', nome:'Débito/Pix'}, {id:'dinheiro', nome:'Dinheiro'}];
function pagamentos(cfg){ return [PAGS_FIXOS[0]].concat(cfg.cartoes.map(k => ({id:k.id, nome:k.nome, cartao:true})), [PAGS_FIXOS[1]]); }
const cardById = (cfg, id) => cfg.cartoes.find(k => k.id === id);
const catById = (cfg, id) => cfg.categorias.find(k => k.id === id) || {id, nome:id || 'Sem categoria', emoji:'•'};
const planMonths = cfg => Array.from({length: Math.max(1, +cfg.meses || 12)}, (_, i) => ymAdd(cfg.inicio, i));
const list = c => Object.entries(S.data[c]).map(([id, v]) => Object.assign({id}, v));
const byOrder = (a, b) => ((+a.ordem || 0) - (+b.ordem || 0)) || String(a.nome || '').localeCompare(String(b.nome || ''));

function shiftDate(cfg, s){
  const fer = cfg.receb.feriados || [];
  let t = s;
  for (let i = 0; i < 10; i++) {
    const w = dow(t);
    if (fer.includes(t) || (cfg.receb.regraFeriado === 'util' && (w === 0 || w === 6))) t = dAdd(t, 1); else break;
  }
  return t;
}
function recebimentos(cfg, endYm){
  const r = cfg.receb, out = [];
  const end = ymd(endYm, 31);
  const startYm = cfg.inicio;
  for (let n = 0; n < 500; n++) {
    let prev;
    if (r.regra === 'fixos') {
      const dias = (r.diasFixos || []).map(Number).filter(x => x > 0).sort((a, b) => a - b);
      if (!dias.length) break;
      prev = ymd(ymAdd(startYm, Math.floor(n / dias.length)), dias[n % dias.length]);
    } else {
      if (!r.ancora || !(+r.intervalo > 0)) break;
      prev = dAdd(r.ancora, n * (+r.intervalo));
    }
    if (prev > end) break;
    const o = S.data.receb['r' + (n + 1)] || {};
    const data = o.data || shiftDate(cfg, prev);
    const padrao = (Array.isArray(r.primeiros) && isSet(r.primeiros[n])) ? +r.primeiros[n] : (+r.valorPadrao || 0);
    const real = isSet(o.valor);
    out.push({n:n + 1, id:'r' + (n + 1), prevista:prev, data, ym:ymOf(data), padrao, valor: real ? +o.valor : padrao, real, recebido: !!o.recebido, obs:o.obs || ''});
  }
  return out;
}
function extraParcelas(e, rec){
  const n = Math.max(1, Math.round(+e.parcelas || 1)), out = [];
  if (!e.mesInicio) return out;
  for (let i = 0; i < n; i++) {
    const ym = ymAdd(e.mesInicio, i);
    const valor = (Array.isArray(e.valores) && isSet(e.valores[i])) ? +e.valores[i] : (+e.total || 0) / n;
    let data;
    if (!(+e.dia)) { const rs = rec.filter(r => r.ym === ym); data = rs.length ? rs[rs.length - 1].data : ymd(ym, 31); }
    else data = ymd(ym, +e.dia);
    out.push({i, ym, valor, data, pago: !!(e.pagos && e.pagos[i])});
  }
  return out;
}
function placaMes(final){
  const f = String(final).trim(); if (f === '') return null;
  const d = +f.slice(-1);
  return d === 1 || d === 2 ? 7 : d === 3 || d === 4 ? 8 : d === 5 || d === 6 ? 9 : d === 7 || d === 8 ? 10 : d === 9 ? 11 : 12;
}
function anualMes(cfg, a){
  if (a.placaAuto && a.mes) { const m = placaMes(cfg.placa.finalPlaca); if (m) return a.mes.slice(0, 4) + '-' + pad(m); }
  return a.mes;
}
function dueOf(card, dateStr){
  const ym = ymOf(dateStr), day = +dateStr.slice(8);
  const fecha = +card.fecha || 1, vence = +card.vence || 10;
  const closeYm = day >= fecha ? ymAdd(ym, 1) : ym;
  const dueYm = vence > fecha ? closeYm : ymAdd(closeYm, 1);
  return {closeYm, dueYm, closeDate: ymd(closeYm, fecha), dueDate: ymd(dueYm, vence)};
}

function compute(opts){
  opts = opts || {};
  const cfg = opts.cfg || C();
  const g = isSet(opts.gastoDia) ? +opts.gastoDia : +cfg.gastoDia || 0;
  const pure = !!opts.pure;
  const useReal = !pure && cfg.usarReal !== false;
  const months = planMonths(cfg);
  const start = months[0], end = months[months.length - 1];
  const today = todayStr(), tYm = ymOf(today);
  const rec = recebimentos(cfg, end);
  const recPlan = rec.filter(x => x.ym >= start && x.ym <= end);
  const fixas = list('fixas').filter(f => f.ativa !== false).sort(byOrder);
  const recs = list('recorrentes').filter(f => f.ativa !== false).sort(byOrder);
  const anuais = list('anuais').map(a => Object.assign({}, a, {mesCalc: anualMes(cfg, a)})).sort((a, b) => String(a.mesCalc).localeCompare(String(b.mesCalc)));
  let extras = list('extras');
  if (opts.extraOverride) extras = extras.map(e => e.id === opts.extraOverride.id ? Object.assign({}, e, opts.extraOverride, {valores:null}) : e);
  const diario = pure ? [] : list('diario').filter(d => d.data && d.data >= ymd(start, 1) && d.data <= ymd(end, 31));
  const r = (+cfg.rendimento || 0) / 100;
  const fixTotal = sum(fixas, f => f.valor);
  const recTotal = sum(recs, f => f.valor);
  const diasMes = +cfg.diasMes || 30.4;
  const custoVida = fixTotal + recTotal + g * diasMes;
  const meta = (+cfg.metaMeses || 0) * custoVida;
  const rendaMedia = sum(recPlan, x => x.valor) / months.length;
  const teto = (+cfg.tetoPct || 0) / 100 * rendaMedia;
  const anuaisPlano = anuais.filter(a => a.mesCalc >= start && a.mesCalc <= end);
  const antigoTotal = sum(cfg.cartoes, k => k.antigo);
  const extrasParc = extras.map(e => ({e, ps: extraParcelas(e, rec)}));
  let poteIni = +cfg.poteInicial || 0, resIni = +cfg.reservaInicial || 0;
  const rows = [];
  months.forEach((ym, i) => {
    const md = (!pure && S.data.meses[ym]) || {};
    const recM = rec.filter(x => x.ym === ym);
    const entReceb = sum(recM, x => x.valor);
    const extM = [];
    extrasParc.forEach(({e, ps}) => ps.forEach(p => { if (p.ym === ym) extM.push(Object.assign({}, p, {e})); }));
    const entExtra = sum(extM.filter(x => x.e.tipo === 'entrada'), x => x.valor);
    const saiExtra = sum(extM.filter(x => x.e.tipo !== 'entrada'), x => x.valor);
    const dM = diario.filter(x => ymOf(x.data) === ym);
    const livreReal = sum(dM.filter(x => !x.extra), x => x.valor);
    const imprev = sum(dM.filter(x => x.extra), x => x.valor);
    const dias = daysIn(ym), orc = g * dias;
    let livre = orc, livreModo = 'plano';
    if (useReal) {
      if (ym < tYm) { livre = livreReal; livreModo = 'real'; }
      else if (ym === tYm) { livre = livreReal + g * (dias - (+today.slice(8))); livreModo = 'parcial'; }
    }
    const fixV = f => (md.fixasValor && isSet(md.fixasValor[f.id])) ? +md.fixasValor[f.id] : (+f.valor || 0);
    const fixM = sum(fixas, fixV);
    const antigas = i === 0 ? antigoTotal : 0;
    const saidas = fixM + recTotal + antigas + livre + saiExtra + imprev;
    const colchao = i === 0 ? (+cfg.colchao || 0) : 0;
    const entradas = entReceb + entExtra;
    const sobra = entradas - saidas - colchao;
    const anuaisMes = sum(anuaisPlano.filter(a => a.mesCalc === ym), a => a.valor);
    const anuaisResta = sum(anuaisPlano.filter(a => a.mesCalc >= ym), a => a.valor);
    const poteRend = poteIni * r, poteAp = poteIni + poteRend;
    const poteDep = Math.min(Math.max(0, anuaisResta - poteAp), Math.max(sobra, 0));
    let poteFim = poteAp + poteDep - anuaisMes, falta = 0;
    if (poteFim < 0) { falta = -poteFim; poteFim = 0; }
    const resRend = resIni * r, resDep = sobra - poteDep;
    let resFim = resIni + resRend + resDep - falta;
    let real = false;
    if (!pure && isSet(md.poteReal)) { poteFim = +md.poteReal; real = true; }
    if (!pure && isSet(md.reservaReal)) { resFim = +md.reservaReal; real = true; }
    rows.push({ym, i, dias, recM, entReceb, entExtra, entradas, fixM, fixV, recTotal, antigas, orc, livre, livreReal, livreModo, imprev, saiExtra, extM, dM, saidas, colchao, sobra,
      anuaisMes, anuaisResta, poteIni, poteRend, poteDep, falta, poteFim, resIni, resRend, resDep, resFim, total: poteFim + resFim, pctMeta: meta ? resFim / meta : 0, md, real});
    poteIni = poteFim; resIni = resFim;
  });
  const model = {cfg, g, pure, useReal, months, start, end, today, tYm, rec, recPlan, fixas, recs, anuais, anuaisPlano, extras, extrasParc, diario, rows, r,
    fixTotal, recTotal, custoVida, meta, rendaMedia, teto, antigoTotal, diasMes};
  model.fat = faturas(model);
  return model;
}
function faturas(M){
  const {cfg, months, recs, diario} = M;
  const map = {};
  const add = (cid, ym, v, item) => { const k = cid + '|' + ym; (map[k] = map[k] || {prev:0, items:[]}); map[k].prev += v; map[k].items.push(Object.assign({valor:v}, item)); };
  cfg.cartoes.forEach(k => { if (+k.antigo) add(k.id, months[0], +k.antigo, {desc:'Fatura já fechada e compras antes do plano', tipo:'antigo'}); });
  months.forEach(ym => recs.forEach(rc => { const k = cardById(cfg, rc.cartao); if (!k) return; const data = ymd(ym, rc.dia); add(k.id, dueOf(k, data).dueYm, +rc.valor || 0, {desc:rc.nome, data, tipo:'recorrente'}); }));
  diario.forEach(d => { const k = cardById(cfg, d.pag); if (!k) return; add(k.id, dueOf(k, d.data).dueYm, +d.valor || 0, {desc:d.desc || catById(cfg, d.cat).nome, data:d.data, tipo:'diario'}); });
  return months.map(ym => {
    const row = M.rows.find(x => x.ym === ym);
    const md = (!M.pure && S.data.meses[ym]) || {};
    const por = {};
    let total = 0, prevTotal = 0;
    cfg.cartoes.forEach(k => {
      const e = map[k.id + '|' + ym] || {prev:0, items:[]};
      const f = (md.faturas && md.faturas[k.id]) || {};
      const valor = isSet(f.valor) ? +f.valor : e.prev;
      por[k.id] = {prev:e.prev, items:e.items, real:isSet(f.valor), valor, pago:!!f.pago, dueDate: ymd(ym, k.vence)};
      total += valor; prevTotal += e.prev;
    });
    return {ym, por, total, prevTotal, pct: row && row.entradas ? total / row.entradas : 0, teto:M.teto, espaco:M.teto - total};
  });
}
/* compras no cartão feitas no mês (competência) */
function comprasCartaoMes(M, ym){ return sum(M.diario.filter(d => ymOf(d.data) === ym && cardById(M.cfg, d.pag)), d => d.valor); }

function calendario(M){
  const {cfg, months, rows, rec, fixas, fat, today} = M;
  const start = ymd(months[0], 1), end = ymd(months[months.length - 1], 31);
  const ev = {};
  const add = (d, e) => { if (d < start || d > end) return; (ev[d] = ev[d] || []).push(e); };
  rec.forEach(r => add(r.data, {desc:'Recebimento ' + pad(r.n), valor:r.valor, kind:'receb', id:r.id, done:r.recebido}));
  rows.forEach(row => {
    const ym = row.ym, md = row.md || {};
    fixas.forEach(f => {
      const dias = (Array.isArray(f.dias) && f.dias.length ? f.dias : [f.dia || 1]).map(Number);
      const v = row.fixV(f) / dias.length;
      dias.forEach(dd => add(ymd(ym, dd), {desc:f.nome + (dias.length > 1 ? ' (' + (dias.indexOf(dd) + 1) + '/' + dias.length + ')' : ''), valor:-v, kind:'fixa', id:f.id, ym, done: !!(md.fixasPagas && md.fixasPagas[f.id])}));
    });
    const fr = fat.find(x => x.ym === ym);
    if (fr) cfg.cartoes.forEach(k => { const p = fr.por[k.id]; if (p && p.valor) add(p.dueDate, {desc:'Fatura ' + k.nome, valor:-p.valor, kind:'fatura', id:k.id, ym, done:p.pago}); });
    row.extM.forEach(p => add(p.data, {desc:p.e.nome + (p.e.parcelas > 1 ? ' (' + (p.i + 1) + '/' + p.e.parcelas + ')' : ''), valor: p.e.tipo === 'entrada' ? p.valor : -p.valor, kind:'extra', id:p.e.id, i:p.i, done:p.pago}));
    const last = ymd(ym, 31);
    const transf = isSet(md.transferido) ? +md.transferido : (row.poteDep + row.resDep);
    if (Math.abs(transf) > 0.004) add(last, {desc: transf >= 0 ? 'Mandar sobra para as caixinhas' : 'Resgatar das caixinhas', valor:-transf, kind:'transfer', ym, done: isSet(md.transferido)});
  });
  const debDiario = {};
  M.diario.forEach(d => { if (!cardById(cfg, d.pag)) debDiario[d.data] = (debDiario[d.data] || 0) + (+d.valor || 0); });
  const allDiario = {};
  M.diario.forEach(d => { allDiario[d.data] = (allDiario[d.data] || 0) + (+d.valor || 0); });
  const aj = cfg.ajuste && cfg.ajuste.data && isSet(cfg.ajuste.valor) ? cfg.ajuste : null;
  let saldo = +cfg.saldoContaInicial || 0;
  const days = [];
  for (let d = start; d <= end; d = dAdd(d, 1)) {
    const evs = (ev[d] || []).slice();
    let livre;
    if (!M.useReal) livre = M.g;
    else if (d < today) livre = debDiario[d] || 0;
    else if (d === today) livre = (debDiario[d] || 0) + Math.max(0, M.g - (allDiario[d] || 0));
    else livre = M.g;
    if (livre) evs.push({desc: d < today && M.useReal ? 'Gastos no débito (Diário)' : 'Gasto livre previsto', valor:-livre, kind:'livre'});
    saldo += sum(evs, e => e.valor);
    let ajustado = false;
    if (aj && aj.data === d) { saldo = +aj.valor; ajustado = true; }
    days.push({d, ym:ymOf(d), evs, saldo, ajustado});
  }
  const minPorMes = {};
  days.forEach(x => { const m = minPorMes[x.ym]; if (!m || x.saldo < m.saldo) minPorMes[x.ym] = x; });
  return {days, minPorMes};
}

/* resumo do gasto livre de um mês */
function livreStatus(M, ym){
  const today = M.today, dias = daysIn(ym), orc = M.g * dias;
  const dM = M.diario.filter(x => ymOf(x.data) === ym && !x.extra);
  const gasto = sum(dM, x => x.valor);
  const restantes = ym === ymOf(today) ? dias - (+today.slice(8)) + 1 : ym > ymOf(today) ? dias : 0;
  const disp = orc - gasto;
  const hoje = sum(dM.filter(x => x.data === today), x => x.valor);
  return {orc, gasto, disp, restantes, porDia: restantes > 0 ? disp / restantes : 0, hoje, dias};
}
function viewYm(M){ return M.tYm < M.start ? M.start : M.tYm > M.end ? M.end : M.tYm; }

/* cenários: e se eu gastar mais ou menos por dia */
function cenarioGasto(g){
  const M = compute({pure:true, gastoDia:g});
  const ini = (+M.cfg.poteInicial || 0) + (+M.cfg.reservaInicial || 0);
  let c = ini, bate = null;
  M.rows.forEach(r => { c += r.sobra - r.anuaisMes; if (bate == null && c >= M.meta) bate = r.ym; });
  const sobraMedia = M.rendaMedia - M.fixTotal - M.recTotal - g * M.diasMes;
  const anuaisMedia = sum(M.anuaisPlano, a => a.valor) / M.months.length;
  if (bate == null) {
    const per = sobraMedia - anuaisMedia, need = M.meta - c;
    bate = per > 0 ? ymAdd(M.end, Math.ceil(need / per)) : null;
  }
  return {g, sobraMedia, guardado:c, meta:M.meta, pct: M.meta ? c / M.meta : 0, bate};
}
/* calculadora de patrimônio */
function projPatrimonio(M, gasto, cortes, prazo, rMes){
  const anuaisMedia = sum(M.anuaisPlano, a => a.valor) / M.months.length;
  const guarda = M.rendaMedia - M.fixTotal - M.recTotal - gasto * M.diasMes - anuaisMedia + (+cortes || 0);
  const extrasTot = sum(M.extras.filter(e => e.tipo !== 'entrada'), e => e.total) - sum(M.extras.filter(e => e.tipo === 'entrada'), e => e.total);
  const inicio = (+M.cfg.poteInicial || 0) + (+M.cfg.reservaInicial || 0) - M.antigoTotal - extrasTot;
  const serie = [inicio]; let p = inicio;
  for (let k = 1; k <= prazo; k++) { p = p * (1 + rMes) + guarda; serie.push(p); }
  const bolso = inicio + guarda * prazo;
  return {guarda, inicio, serie, fim:p, bolso, rend:p - bolso, pctRenda: M.rendaMedia ? guarda / M.rendaMedia : 0, mesesVida: M.custoVida ? p / M.custoVida : 0, anuaisMedia};
}
/* simulador de parcelamento de um extra (sem rendimento) */
function simExtra(id, parcelas, mesInicio){
  const M = compute({pure:true, extraOverride:{id, parcelas, mesInicio}});
  let c = (+M.cfg.poteInicial || 0) + (+M.cfg.reservaInicial || 0), min = Infinity, minYm = null;
  const serie = M.rows.map(r => { c += r.sobra - r.anuaisMes; if (c < min) { min = c; minYm = r.ym; } return c; });
  return {serie, min, minYm, fim:c, labels:M.months.map(ymLabel)};
}

/* ===================== finanças: fórmulas das calculadoras ===================== */
const FV = (pv, pmt, r, n) => r ? pv * Math.pow(1 + r, n) + pmt * (Math.pow(1 + r, n) - 1) / r : pv + pmt * n;
const PMTmeta = (fv, pv, r, n) => r ? (fv - pv * Math.pow(1 + r, n)) * r / (Math.pow(1 + r, n) - 1) : (fv - pv) / n;
const PVann = (pmt, r, n) => r ? pmt * (1 - Math.pow(1 + r, -n)) / r : pmt * n;
function irParcelas(avista, parcela, n, noAto){
  const pv = i => noAto ? parcela + PVann(parcela, i, n - 1) : PVann(parcela, i, n);
  if (parcela * n <= avista + 1e-9) return 0;
  let lo = 0, hi = 1;
  for (let k = 0; k < 100; k++) { const mid = (lo + hi) / 2; if (pv(mid) > avista) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
const aliquotaIR = dias => dias <= 180 ? 22.5 : dias <= 360 ? 20 : dias <= 720 ? 17.5 : 15;

/* ===================== gráficos (SVG) ===================== */
let CH = {}, chartSeq = 0;
function niceTicks(min, max, count){
  const span = max - min || Math.abs(max) || 1;
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
function chart(spec){
  const id = 'ch' + (++chartSeq); CH[id] = spec;
  let leg = '';
  const items = spec.series.filter(s => !s.noLegend).map(s => `<span><i class="${s.dash ? 'sw-dash' : spec.type === 'bar' ? 'sw-dot' : 'sw-line'}" style="${spec.type === 'bar' && !s.dash ? 'background' : 'border-color'}:var(${s.color})"></i>${esc(s.name)}</span>`);
  (spec.refs || []).forEach(r => items.push(`<span><i class="sw-dash" style="border-color:var(${r.color || '--axis'})"></i>${esc(r.label)}</span>`));
  if (items.length > 1 || spec.legend) leg = `<div class="legend">${items.join('')}</div>`;
  return `<div class="chart" id="${id}" style="height:${spec.h || 190}px" role="img" aria-label="${esc(spec.title || '')}"></div>${leg}`;
}
function drawCharts(){ for (const id in CH) { const el = document.getElementById(id); if (el) drawChart(el, CH[id]); } }
function drawChart(el, sp){
  const W = Math.max(260, el.clientWidth || 320), H = sp.h || 190;
  const padL = sp.padL || 46, padR = 10, padT = 14, padB = 22;
  const n = sp.labels.length;
  const isBar = sp.type === 'bar';
  let vals = [];
  if (isBar && sp.stacked) { for (let i = 0; i < n; i++) { let p = 0, q = 0; sp.series.forEach(s => { const v = +s.values[i] || 0; if (v >= 0) p += v; else q += v; }); vals.push(p, q); } }
  else sp.series.forEach(s => s.values.forEach(v => { if (v != null && !isNaN(v)) vals.push(+v); }));
  (sp.refs || []).forEach(r => vals.push(r.value));
  if (sp.zero !== false) vals.push(0);
  if (!vals.length) vals = [0, 1];
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { max = min + 1; }
  const ticks = niceTicks(min, max, sp.ticks || 4); min = ticks[0]; max = ticks[ticks.length - 1];
  const ih = H - padT - padB, iw = W - padL - padR;
  const y = v => padT + (max - v) / (max - min) * ih;
  const band = iw / Math.max(n, 1);
  const x = i => isBar ? padL + band * i + band / 2 : padL + (n <= 1 ? iw / 2 : i * iw / (n - 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  ticks.forEach(t => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" class="g${t === 0 ? ' g0' : ''}"/><text x="${padL - 6}" y="${y(t) + 4}" class="yt" text-anchor="end">${esc((sp.fmtAxis || kfmt)(t))}</text>`; });
  const maxLab = Math.max(1, Math.floor(iw / (sp.labW || 40)));
  const step = Math.max(1, Math.ceil(n / maxLab));
  sp.labels.forEach((l, i) => { if (i % step === 0) s += `<text x="${x(i)}" y="${H - 5}" class="xt" text-anchor="middle">${esc(l)}</text>`; });
  if (isBar) {
    const k = sp.stacked ? 1 : sp.series.length;
    const bw = Math.max(3, Math.min(26, (band * 0.7 - (k - 1) * 2) / k));
    for (let i = 0; i < n; i++) {
      if (sp.stacked) {
        let p = 0, q = 0;
        sp.series.forEach(se => {
          const v = +se.values[i] || 0; if (!v) return;
          let y0, y1; if (v >= 0) { y0 = y(p + v); y1 = y(p); p += v; } else { y0 = y(q); y1 = y(q + v); q += v; }
          const hgt = Math.max(0, y1 - y0 - 2);
          s += `<rect x="${x(i) - bw / 2}" y="${y0 + (v >= 0 ? 2 : 0)}" width="${bw}" height="${hgt}" rx="3" fill="var(${se.color})"/>`;
        });
      } else {
        sp.series.forEach((se, si) => {
          const v = +se.values[i]; if (!v) return;
          const xl = x(i) - (k * bw + (k - 1) * 2) / 2 + si * (bw + 2);
          const y0 = y(Math.max(v, 0)), y1 = y(Math.min(v, 0));
          const col = se.colorFn ? se.colorFn(v) : se.color;
          s += `<rect x="${xl}" y="${y0}" width="${bw}" height="${Math.max(1, y1 - y0)}" rx="3" fill="var(${col})"/>`;
        });
      }
    }
  } else {
    sp.series.forEach(se => {
      let d = '', started = false, area = '';
      se.values.forEach((v, i) => { if (v == null || isNaN(v)) { started = false; return; } d += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); started = true; });
      if (se.area && d) { const idx = se.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0); area = `<path d="${d}L${x(idx[idx.length - 1])} ${y(Math.max(min, 0))}L${x(idx[0])} ${y(Math.max(min, 0))}Z" fill="var(${se.color})" opacity=".12"/>`; }
      s += area + `<path d="${d}" fill="none" stroke="var(${se.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${se.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
      if (se.endDot) { let li = -1; se.values.forEach((v, i) => { if (v != null) li = i; }); if (li >= 0) s += `<circle cx="${x(li)}" cy="${y(se.values[li])}" r="4" fill="var(${se.color})" stroke="var(--card)" stroke-width="2"/>`; }
    });
  }
  (sp.refs || []).forEach(r => { s += `<line x1="${padL}" x2="${W - padR}" y1="${y(r.value)}" y2="${y(r.value)}" stroke="var(${r.color || '--axis'})" stroke-width="1.5" stroke-dasharray="5 4"/>`; });
  (sp.markers || []).forEach(m => { const cx = x(m.i), cy = y(m.v); const anchor = cx > W - 80 ? 'end' : cx < padL + 60 ? 'start' : 'middle'; s += `<circle cx="${cx}" cy="${cy}" r="4.5" fill="var(${m.color || '--crit'})" stroke="var(--card)" stroke-width="2"/><text x="${cx}" y="${cy + (m.below ? 16 : -9)}" class="lbl" text-anchor="${anchor}">${esc(m.label)}</text>`; });
  s += `<line class="xh" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const svg = el.firstChild, xh = svg.querySelector('.xh'), tip = el.querySelector('.tip');
  const fmtV = sp.fmt || fmt;
  const show = e => {
    const rect = el.getBoundingClientRect(); const px = (e.clientX - rect.left) * (W / rect.width);
    let i = isBar ? Math.floor((px - padL) / band) : Math.round((px - padL) / (iw / Math.max(n - 1, 1)));
    i = Math.max(0, Math.min(n - 1, i));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    let h = `<b>${esc(sp.tipLabels ? sp.tipLabels[i] : sp.labels[i])}</b>`;
    sp.series.forEach(se => { const v = se.values[i]; if (v == null) return; h += `<div class="tr"><span><i class="${isBar ? 'sw-dot' : se.dash ? 'sw-dash' : 'sw-line'}" style="${isBar ? 'background' : 'border-color'}:var(${se.colorFn ? se.colorFn(v) : se.color})"></i>${esc(se.name)}</span><span class="num">${esc(fmtV(v))}</span></div>`; });
    (sp.refs || []).forEach(r => { h += `<div class="tr"><span><i class="sw-dash" style="border-color:var(${r.color || '--axis'})"></i>${esc(r.label)}</span><span class="num">${esc(fmtV(r.value))}</span></div>`; });
    if (sp.tipExtra) h += sp.tipExtra(i);
    tip.innerHTML = h; tip.hidden = false;
    const tx = x(i) / W * rect.width;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(rect.width - tw, tx + (tx > rect.width / 2 ? -tw - 12 : 12))) + 'px';
    tip.style.top = '4px';
  };
  el.onpointermove = show; el.onpointerdown = show;
  el.onpointerleave = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
}

function viewHoje(){

  const ym = viewYm(M);
  const ls = livreStatus(M, ym);
  const row = M.rows.find(r => r.ym === ym);
  const last = M.rows[M.rows.length - 1];
  const cal = calendario(M);
  const dToday = cal.days.find(x => x.d === today) || cal.days[0];
  const minM = cal.minPorMes[ym];
  let h = header('Hoje', dayLong(today).replace(/^./, c => c.toUpperCase()));
  if (S.mode === 'local') h += `<div class="banner">Modo local: os dados ficam só neste navegador. Abra pelo link do claude.ai para sincronizar entre celular e computador.</div>`;

  let status = '';
  if (today < ymd(M.start, 1)) { const n = dDiff(today, ymd(M.start, 1)); status = `Seu plano começa em 1º de ${MESL[+M.start.slice(5) - 1]} (${n === 1 ? 'amanhã' : 'em ' + n + ' dias'}). Até lá, os números abaixo mostram o primeiro mês.`; }
  else if (today > ymd(M.end, 31)) status = `O plano terminou em ${ymLabel(M.end)}. Em Mais → Premissas, mude o primeiro mês para começar o próximo ano.`;
  if (status) h += `<div class="banner">${esc(status)}</div>`;

  const porDiaCls = ls.porDia >= M.g - 0.005 ? 'pos' : ls.porDia > 0 ? 'warn' : 'neg';
  const pctGasto = ls.orc ? ls.gasto / ls.orc : 0;
  h += `<section><div class="hero"><div class="k">Pode gastar por dia até o fim de ${esc(MESL[+ym.slice(5) - 1])}</div><div class="big num ${porDiaCls}">${esc(fmt(ls.porDia))}</div><div class="s">Hoje: ${esc(fmt(ls.hoje))} gastos · regra do plano: ${esc(fmt(M.g))}/dia</div><div class="bar" aria-label="Gasto livre do mês"><i class="${pctGasto > 1 ? 'over' : ''}" style="width:${Math.min(100, pctGasto * 100).toFixed(1)}%"></i></div><div class="s" style="margin-top:8px">${esc(fmt(ls.gasto))} de ${esc(fmt(ls.orc))} do gasto livre · ${ls.disp >= 0 ? 'restam ' + esc(fmt(ls.disp)) : '<span class="neg">passou ' + esc(fmt(-ls.disp)) + '</span>'} em ${ls.restantes} ${ls.restantes === 1 ? 'dia' : 'dias'}</div></div>`;
  h += `<div class="btns" style="margin-top:12px"><button class="btn" data-act="novoGasto">${ICON.plus.replace('<svg', '<svg width="20" height="20"')} Lançar gasto</button></div></section>`;

  const espacoCartao = M.teto - M.recTotal - comprasCartaoMes(M, ym);
  h += `<section><div class="tiles">`;
  h += tile('Sobra prevista de ' + ymLabel(ym), esc(fmt0(row.sobra)), 'vai para as caixinhas no fim do mês', row.sobra < 0 ? 'neg' : '', 'goMes:' + ym);
  h += tile('Guardado em ' + ymLabel(M.end), esc(fmt0(last.total)), 'Pote + Reserva · ' + pc(last.pctMeta, 0) + ' da meta', last.total < 0 ? 'neg' : '', 'goPlano:resumo');
  h += tile(today < ymd(M.start, 1) ? 'Saldo previsto em ' + dLabel(cal.days[0].d) : 'Saldo previsto na conta hoje', esc(fmt0(dToday.saldo)), minM ? 'menor do mês: ' + esc(fmt0(minM.saldo)) + ' em ' + dLabel(minM.d) : '', dToday.saldo < 0 ? 'neg' : '', 'goPlano:calendario');
  h += tile('Espaço no cartão (' + ymLabel(ym) + ')', esc(fmt0(espacoCartao)), 'teto ' + esc(fmt0(M.teto)) + ' − recorrentes − compras', espacoCartao < 0 ? 'neg' : '', 'goPlano:faturas');
  h += `</div></section>`;

  const alerts = [];
  if (minM && minM.saldo < 0) alerts.push(['crit', '!', `A conta fica negativa em ${dLabelY(minM.d)} (${fmt(minM.saldo)}). ${cfg.limiteConta ? 'Entra no limite do banco, com juros.' : ''} Adie um gasto ou antecipe uma transferência.`]);
  else if (minM && minM.saldo < 300) alerts.push(['warn', '!', `Saldo apertado em ${dLabelY(minM.d)}: ${fmt(minM.saldo)}.`]);
  if (ls.disp < 0) alerts.push(['crit', '!', `O gasto livre de ${ymLabel(ym)} passou do orçamento em ${fmt(-ls.disp)}. Isso sai da sobra do mês.`]);
  const fr = M.fat.find(f => f.ym === ym);
  if (fr && fr.total > M.teto) alerts.push(['warn', '!', `As faturas que vencem em ${ymLabel(ym)} (${fmt(fr.total)}) passam do teto de ${fmt(M.teto)}.`]);
  const pend = list('pend').filter(p => !p.feito);
  if (pend.length) alerts.push(['info', String(pend.length), `${pend.length === 1 ? 'Uma pendência' : pend.length + ' pendências'} do plano para resolver.`, 'goSub:pendencias']);
  if (row.real || row.md.fechado) alerts.push(['good', '✓', `${ymLabel(ym)} já foi fechado com os saldos reais das caixinhas.`]);
  if (alerts.length) h += `<section><div class="alerts">${alerts.map(a => `<${a[3] ? `button data-act="${a[3]}" style="border:0;text-align:left;width:100%"` : 'div'} class="alert ${a[0]}"><span class="dot">${esc(a[1])}</span><span>${esc(a[2])}</span></${a[3] ? 'button' : 'div'}>`).join('')}</div></section>`;

  // gráfico do gasto acumulado
  const labels = [], real = [], plan = [];
  let acc = 0;
  const dMap = {}; M.diario.filter(x => ymOf(x.data) === ym && !x.extra).forEach(x => { dMap[x.data] = (dMap[x.data] || 0) + (+x.valor || 0); });
  for (let d = 1; d <= ls.dias; d++) { const ds = ymd(ym, d); labels.push(String(d)); acc += dMap[ds] || 0; real.push(ds <= today ? acc : null); plan.push(M.g * d); }
  h += `<section><div class="chart-card"><h4>Gasto livre acumulado</h4><div class="cs">${esc(ymLong(ym))}: o que você gastou × o ritmo de ${esc(fmt(M.g))} por dia</div>${chart({type:'line', labels, tipLabels:labels.map(d => d + '/' + ym.slice(5)), series:[{name:'Gasto real', color:'--s1', values:real, area:true, endDot:true}, {name:'Ritmo do plano', color:'--axis', values:plan, dash:true}], h:170, labW:28})}</div></section>`;

  // próximos 10 dias
  const from = today < ymd(M.start, 1) ? ymd(M.start, 1) : today, to = dAdd(from, 10);
  const prox = [];
  cal.days.filter(x => x.d >= from && x.d <= to).forEach(x => x.evs.forEach(e => { if (e.kind !== 'livre') prox.push(Object.assign({d:x.d}, e)); }));
  h += `<section><h3 class="gh"><span>Próximos 10 dias</span><button data-act="goPlano:calendario">Calendário</button></h3><div class="group">`;
  if (!prox.length) h += `<div class="empty">Nada agendado nos próximos dias.</div>`;
  prox.forEach(e => { h += eventRow(e); });
  h += `</div><p class="gf">Toque no círculo para marcar como pago ou recebido.</p></section>`;

  if (!cfg.tutorialVisto) h += `<section><div class="note"><b>Primeira vez aqui?</b> Veja em 1 minuto como usar o app no dia a dia.</div><div class="btns" style="margin-top:10px"><button class="btn tint" data-act="onboard">Ver o tutorial</button></div></section>`;
  return h;
}
function eventRow(e){

/* ===================== VIEW: Diário ===================== */
function viewDiario(){
  const M = compute(), cfg = M.cfg;
  const allMonths = Array.from(new Set(M.months.concat(list('diario').map(d => ymOf(d.data || ''))).filter(Boolean))).sort();
  if (!UI.dym || !allMonths.includes(UI.dym)) UI.dym = viewYm(M);
  const ym = UI.dym;
  const ls = livreStatus(M, ym);
  const inPlan = ym >= M.start && ym <= M.end;
  const entries = list('diario').filter(d => ymOf(d.data || '') === ym).sort((a, b) => (b.data || '').localeCompare(a.data || '') || String(b.criado || '').localeCompare(String(a.criado || '')));
  let h = header('Diário', 'Só o gasto livre do dia a dia', plusBtn('novoGasto', 'Lançar gasto'));
  h += `<section>${mswitch(ym, allMonths, 'dym')}</section>`;
  if (!inPlan) h += `<div class="banner">Este mês está fora do plano: os lançamentos aparecem aqui, mas não entram nas contas.</div>`;
  const cartaoMes = sum(entries.filter(d => cardById(cfg, d.pag)), d => d.valor);
  const imprev = sum(entries.filter(d => d.extra), d => d.valor);
  h += `<section><div class="tiles">${tile('Gasto livre', esc(fmt(ls.gasto)), 'de ' + esc(fmt(ls.orc)) + ' (' + pc(ls.orc ? ls.gasto / ls.orc : 0, 0) + ')', ls.gasto > ls.orc ? 'neg' : '')}${tile('Pode gastar/dia', esc(fmt(ls.porDia)), ls.restantes ? ls.restantes + ' dias restantes' : 'mês encerrado', ls.porDia < 0 ? 'neg' : '')}${tile('No cartão', esc(fmt(cartaoMes)), 'compras feitas neste mês')}${tile('Imprevistos', esc(fmt(imprev)), 'fora do gasto livre')}</div></section>`;

  const byCat = {};
  entries.filter(d => !d.extra).forEach(d => { byCat[d.cat] = (byCat[d.cat] || 0) + (+d.valor || 0); });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (cats.length) {
    const mx = cats[0][1] || 1, tot = sum(cats, c => c[1]) || 1;
    h += `<section><h3 class="gh"><span>Onde foi o dinheiro</span></h3><div class="group">${cats.map(([id, v]) => { const c = catById(cfg, id); return `<div class="catbar"><span class="ico">${esc(c.emoji)}</span><span class="nm">${esc(c.nome)}</span><span class="num">${esc(fmt(v))} <span class="muted" style="font-size:13px">${pc(v / tot, 0)}</span></span><span class="tr2"><i style="width:${(v / mx * 100).toFixed(1)}%"></i></span></div>`; }).join('')}</div></section>`;
  }
  h += `<section><h3 class="gh"><span>Lançamentos</span><span class="num">${entries.length}</span></h3>`;
  if (!entries.length) h += `<div class="group"><div class="empty">Nenhum gasto lançado em ${esc(ymLong(ym))}.<br>Toque em + para lançar.</div></div>`;
  else {
    const byDay = {};
    entries.forEach(d => { (byDay[d.data] = byDay[d.data] || []).push(d); });
    Object.keys(byDay).sort().reverse().forEach(day => {
      const tot = sum(byDay[day], d => d.valor);
      h += `<h3 class="gh" style="margin-top:14px"><span>${esc(DOW[dow(day)])}, ${esc(dLabel(day))}</span><span class="num">${esc(fmt(tot))}</span></h3><div class="group">`;
      byDay[day].forEach(d => {
        const c = catById(cfg, d.cat), k = cardById(cfg, d.pag);
        const pagNome = k ? k.nome : (PAGS_FIXOS.find(p => p.id === d.pag) || {nome:d.pag || ''}).nome;
        const info = k ? pagNome + ' · fatura de ' + ymLabel(dueOf(k, d.data).dueYm) : pagNome;
        h += `<button class="row ic" data-act="editGasto:${esc(d.id)}"><span class="ico">${esc(c.emoji)}</span><span class="grow"><div class="t">${esc(d.desc || c.nome)}</div><div class="d">${esc(c.nome)} · ${esc(info)}${d.extra ? ' · imprevisto' : ''}</div></span><span class="v num">${esc(fmt(+d.valor))}</span></button>`;
      });
      h += `</div>`;
    });
  }
  h += `<p class="gf">Anote aqui comer fora, lazer, farmácia, roupas, mercado extra… Contas fixas e cobranças que se repetem no cartão já estão no plano: não lance de novo.</p></section>`;
  return h;
}

function planoCalendario(M){
  const cal = calendario(M);
  if (!UI.cym || !M.months.includes(UI.cym)) UI.cym = viewYm(M);
  const ym = UI.cym;
  const days = cal.days.filter(x => x.ym === ym);
  const mn = cal.minPorMes[ym];
  const mi = days.indexOf(mn);
  let h = `<section>${mswitch(ym, M.months, 'cym')}</section>`;
  h += `<section><div class="chart-card"><h4>Saldo previsto da conta corrente</h4><div class="cs">Visão conservadora: ${M.useReal ? 'dias passados usam o Diário; ' : ''}o gasto livre futuro sai todo dia no débito</div>${chart({type:'line', labels:days.map(x => String(+x.d.slice(8))), tipLabels:days.map(x => DOWS[dow(x.d)] + ', ' + dLabel(x.d)), series:[{name:'Saldo', color:'--s1', values:days.map(x => x.saldo), area:true}], markers: mn ? [{i:mi, v:mn.saldo, label:'menor: ' + fmt0(mn.saldo), color: mn.saldo < 0 ? '--crit' : '--s2', below: mn.saldo > (sum(days, x => x.saldo) / days.length)}] : [], h:200, labW:26, tipExtra:i => { const ev = days[i].evs.filter(e => e.kind !== 'livre'); return ev.length ? '<div style="margin-top:4px;border-top:.5px solid var(--sep);padding-top:4px">' + ev.map(e => `<div class="tr"><span>${esc(e.desc)}</span><span class="num">${esc(fmtS(e.valor))}</span></div>`).join('') + '</div>' : ''; }})}</div></section>`;
  h += `<section><div class="btns"><button class="btn tint" data-act="ajusteSaldo">Informar saldo real da conta</button></div>${M.cfg.ajuste && M.cfg.ajuste.data ? `<p class="gf">Saldo real informado: ${esc(fmt(+M.cfg.ajuste.valor))} em ${esc(dLabelY(M.cfg.ajuste.data))}. Daí em diante o calendário parte desse valor.</p>` : `<p class="gf">Conferiu o app do banco? Digite o saldo de hoje e o calendário se corrige.</p>`}</section>`;
  h += `<section><h3 class="gh"><span>Dia a dia</span><span>◀ = menor saldo</span></h3><div class="group">`;
  days.forEach(x => {
    const evs = x.evs.filter(e => e.kind !== 'livre');
    const liv = x.evs.find(e => e.kind === 'livre');
    const isMin = mn && x.d === mn.d;
    if (!evs.length && !isMin && !x.ajustado && x.d !== M.today) return;
    h += `<div class="row"><span class="grow"><div class="t">${esc(DOWS[dow(x.d)])}, ${esc(dLabel(x.d))}${x.d === M.today ? ' · hoje' : ''}${isMin ? ' ◀' : ''}</div><div class="d">${evs.map(e => esc(e.desc) + ' ' + esc(fmtS(e.valor))).join(' · ') || 'sem contas'}${liv ? ' · gasto livre ' + esc(fmt(-liv.valor)) : ''}${x.ajustado ? ' · saldo real informado' : ''}</div></span><span class="v num ${x.saldo < 0 ? 'neg' : ''}">${esc(fmt(x.saldo))}</span></div>`;
  });
  h += `</div></section>`;
  h += `<section><h3 class="gh"><span>Menor saldo de cada mês</span></h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Mês</th><th>Dia</th><th>Saldo</th></tr></thead><tbody>`;
  let worst = null; M.months.forEach(m => { const x = cal.minPorMes[m]; if (x && (!worst || x.saldo < worst.saldo)) worst = x; });
  M.months.forEach(m => { const x = cal.minPorMes[m]; if (!x) return; h += `<tr data-act="cym:${m}" style="cursor:pointer"><td>${ymLabel(m)}</td><td>${dLabel(x.d)}${x === worst ? ' (menor do ano)' : ''}${x.saldo < 0 ? ' ⚠' : ''}</td><td class="${x.saldo < 0 ? 'neg' : ''}">${fmt(x.saldo)}</td></tr>`; });
  h += `</tbody></table></div></section>`;
  return h;
}
function planoCenarios(M){

  return h;
}

  tetoPct:{label:'Teto (%)', money:true, hint:'Faturas acima desse percentual da renda média apertam o mês. 30% é um bom limite.'},
  metaMeses:{label:'Meses', int:true, hint:'Quantos meses de custo de vida a reserva deve cobrir. Recomendado: 6 (CLT) a 12 (autônomo/PJ).'},

};
function editCfg(k){
  const f = CFG_FIELDS[k], c = C();
  const cur = k === 'finalPlaca' ? c.placa.finalPlaca : c[k];
  const v = f.money ? moneyIn(cur) : cur;
  openSheet(f.label, `<div class="fg">${fld('cf-v', f.label, v, {money:f.money, int:f.int, type:f.type || 'text', af:true})}</div>${f.hint ? `<p class="fh">${esc(f.hint)}</p>` : ''}`, {onSave: () => {
    let nv = val('cf-v').trim();
    if (k === 'finalPlaca') { if (nv !== '' && !/^\d$/.test(nv)) { toast('Digite só o último número da placa.'); return false; } saveCfg({placa:Object.assign({}, c.placa, {finalPlaca:nv})}); toast('Salvo'); return; }
    if (f.type === 'month') { if (!/^\d{4}-\d{2}$/.test(nv)) { toast('Escolha um mês.'); return false; } }
    else { nv = f.money ? parseMoney(nv) : parseInt(nv, 10); if (!isSet(nv) || isNaN(nv) || nv < 0) { toast('Digite um número válido.'); return false; } }
    if (k === 'meses' && (nv < 1 || nv > 60)) { toast('Use de 1 a 60 meses.'); return false; }
    saveCfg({[k]:nv}); toast('Salvo');
  }});
}

function backupJson(){ return JSON.stringify({app:'plano-financeiro', versao:1, exportado:new Date().toISOString(), dados:S.data}, null, 1); }
async function restore(txt){
  let j; try { j = JSON.parse(txt); } catch (e) { toast('Arquivo inválido.'); return; }
  const d = j && j.dados; if (!d || typeof d !== 'object') { toast('Este arquivo não é um backup do app.'); return; }
  let n = 0;
  for (const c of COLS) {
    const src = d[c] || {};
    for (const id of Object.keys(S.data[c])) if (!(id in src)) { await del(c, id); }
    for (const [id, v] of Object.entries(src)) { await put(c, id, v); n++; }
  }
  toast('Backup restaurado (' + n + ' registros)');
}

PAGES['calc-avista'] = () => calcPage('avista', 'À vista ou parcelado?', cin('av', 'Preço à vista', '4.275,00') + cin('ap', 'Valor da parcela', '450,00') + cin('an', 'Nº de parcelas', 10, {money:false, int:true}) + cin('ar', 'Meu rendimento % a.m.', nf(C().rendimento)) + swf('aato', '1ª parcela no ato da compra', cget('aato', false)), calcAvistaOut());

function renderOnb(){
  const s = ONB[onbI], last = onbI === ONB.length - 1;
  $('#onb').innerHTML = `<div class="onb" role="dialog" aria-modal="true" aria-label="Tutorial"><button class="skip" data-act="onbEnd">${last ? '' : 'Pular'}</button><div class="pg"><div class="art" style="background:var(${s.c})">${s.i}</div><h2>${esc(s.t)}</h2>${s.p.map(p => `<p>${esc(p)}</p>`).join('')}</div><div class="foot"><div class="dots">${ONB.map((_, i) => `<i class="${i === onbI ? 'on' : ''}"></i>`).join('')}</div><div class="btns">${last ? `<button class="btn" data-act="onbEnd">Começar</button><button class="btn tint" data-act="onbGuide">Ver o passo a passo completo</button>` : `<button class="btn" data-act="onbNext">Continuar</button>`}</div></div></div>`;
}
function maybeOnboard(){ if (hasCfg() && !C().tutorialVisto && $('#onb').hidden) showOnb(); }
function endOnb(){ $('#onb').hidden = true; if (hasCfg() && !C().tutorialVisto) saveCfg({tutorialVisto:true}); }

/* ===================== ações ===================== */
const ACT = {
  pop, closeSheet,
  sheetSave: () => { if (!sheetSave) return; const r = sheetSave(); if (r !== false) closeSheet(); },
  tab: t => go(t),
  goSub: p => { if (UI.tab !== 'mais') { UI.tab = 'mais'; UI.sub = []; } closeSheet(); push(p); },
  goMes: ym => { UI.ym = ym; go('mes'); },
  goDiario: ym => { UI.dym = ym; go('diario'); },
  goPlano: s => { UI.pseg = s; go('plano'); },
  pseg: s => { UI.pseg = s; render(); },
  dym: ym => { if (ym) { UI.dym = ym; render(); } },
  mym: ym => { if (ym) { UI.ym = ym; render(); } },
  cym: ym => { if (ym) { UI.cym = ym; render(); } },
  novoGasto: () => sheetGasto(null),
  editGasto: id => sheetGasto(id),
  delGasto: id => { closeSheet(); del('diario', id); toast('Gasto apagado'); },
  togReceb: id => { const o = clone(S.data.receb[id] || {}); o.recebido = !o.recebido; put('receb', id, o); },
  editReceb: id => sheetReceb(id),
  editReceb2: k => editReceb2(k),
  togFixa: a => { const [ym, id] = a.split(':'); putMes(ym, m => { m.fixasPagas = m.fixasPagas || {}; if (m.fixasPagas[id]) delete m.fixasPagas[id]; else m.fixasPagas[id] = true; }); },
  togFatura: a => { const [ym, id] = a.split(':'); putMes(ym, m => { m.faturas = m.faturas || {}; const f = m.faturas[id] || {}; f.pago = !f.pago; m.faturas[id] = f; }); },
  togExtra: a => { const [id, i] = a.split(':'); const e = clone(S.data.extras[id]); if (!e) return; e.pagos = e.pagos || {}; if (e.pagos[i]) delete e.pagos[i]; else e.pagos[i] = true; put('extras', id, e); },
  togAnual: id => { const a = clone(S.data.anuais[id]); a.pago = !a.pago; put('anuais', id, a); },
  togPend: id => { const p = clone(S.data.pend[id]); p.feito = !p.feito; put('pend', id, p); },
  togReal: (_, el) => { saveCfg({usarReal: !!el.checked}); },
  editFatura: a => { const [ym, id] = a.split(':'); sheetFatura(ym, id); },
  editFixaMes: a => { const [ym, id] = a.split(':'); sheetFixaMes(ym, id); },
  fecharMes: ym => sheetFechar(ym),
  ajusteSaldo: () => sheetAjuste(),
  limparAjuste: () => { closeSheet(); saveCfg({ajuste:null}); toast('Saldo informado removido'); },
  editCfg: k => editCfg(k),
  editFixa: id => { closeSheet(); setTimeout(() => sheetFixa(id || null), id ? 340 : 0); },
  editRec: id => sheetRec(id || null),
  editCartao: i => sheetCartao(i),
  delCartao: i => { const c = C(); const k = c.cartoes[+i]; if (list('recorrentes').some(r => r.cartao === k.id) || list('diario').some(d => d.pag === k.id)) { toast('Este cartão tem lançamentos. Pause as cobranças antes.'); return; } const cs = clone(c.cartoes); cs.splice(+i, 1); closeSheet(); saveCfg({cartoes:cs}); toast('Cartão apagado'); },
  editAnual: id => sheetAnual(id || null),
  novoExtra: a => { const [t, ym] = a.split(':'); sheetExtra(null, t || 'saida', ym || null); },
  editExtra: id => sheetExtra(id),
  editCat: i => sheetCat(i),
  delCat: i => { const cs = clone(C().categorias); cs.splice(+i, 1); closeSheet(); saveCfg({categorias:cs}); toast('Categoria apagada'); },
  editPend: id => sheetPend(id || null),
  delDoc: a => { const [c, id] = a.split(':'); closeSheet(); del(c, id); toast('Apagado'); },
  onboard: () => showOnb(),
  onbNext: () => { onbI = Math.min(ONB.length - 1, onbI + 1); renderOnb(); },
  onbEnd: () => endOnb(),
  onbGuide: () => { endOnb(); UI.tab = 'mais'; UI.sub = ['comousar']; render(); window.scrollTo(0, 0); },
  usarParcelamento: a => { const [id, n, m] = a.split(':'); const e = clone(S.data.extras[id]); e.parcelas = +n; e.mesInicio = m; e.valores = null; e.pagos = {}; put('extras', id, e); UI.calc.xp = +n; UI.calc.xm = m; toast('Plano atualizado: ' + n + 'x a partir de ' + ymLabel(m)); },
  testParc: a => { const [n, m] = a.split(':'); UI.calc.xp = +n; UI.calc.xm = m; render(); },
  usarRend: v => { saveCfg({rendimento: Math.round(+v * 1000) / 1000}); toast('Rendimento atualizado no plano'); },
  salvarPlaca: p => { const c = C(); saveCfg({placa:Object.assign({}, c.placa, {finalPlaca:p})}); toast('Final da placa salvo'); },
  exportar: async () => {
    const txt = backupJson(), name = 'backup-plano-financeiro-' + todayStr() + '.json';
    let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (dl) { try { await dl.save({filename:name, data:txt}); toast('Backup pronto'); return; } catch (e) { if (e && e.code === 'cancelled') return; } }
    ACT.copiarBackup();
  },
  copiarBackup: async () => { const txt = backupJson(); try { await navigator.clipboard.writeText(txt); toast('Backup copiado'); } catch (e) { const t = $('#bk-txt'); if (t) { t.value = txt; t.select(); toast('Selecionado: copie o texto'); } } },
  importar: async () => {
    const f = $('#bk-file'), t = $('#bk-txt');
    let txt = t ? t.value.trim() : '';
    if (f && f.files && f.files[0]) txt = await f.files[0].text();
    if (!txt) { toast('Escolha um arquivo ou cole o texto.'); return; }
    openSheet('Restaurar backup', `<div class="note" style="margin-top:8px">Os dados atuais serão substituídos pelos do backup. Isso não pode ser desfeito.</div><div class="btns" style="margin-top:14px"><button class="btn danger" data-act="confirmRestore">Substituir tudo</button></div>`);
    ACT._restoreTxt = txt;
  },
  confirmRestore: () => { closeSheet(); restore(ACT._restoreTxt || ''); },
  apagarTudo: () => openSheet('Apagar o Diário', `<div class="note" style="margin-top:8px">Todos os ${list('diario').length} lançamentos do Diário serão apagados. Faça um backup antes.</div><div class="btns" style="margin-top:14px"><button class="btn danger" data-act="confirmApagar">Apagar lançamentos</button></div>`),
  confirmApagar: async () => { closeSheet(); for (const id of Object.keys(S.data.diario)) await del('diario', id); toast('Diário apagado'); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'INPUT' && t.type === 'checkbox') return;
  const s = t.dataset.act, i = s.indexOf(':');
  const a = i < 0 ? s : s.slice(0, i), arg = i < 0 ? '' : s.slice(i + 1);
  if (ACT[a]) { e.preventDefault(); ACT[a](arg, t, e); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('input[type=checkbox][data-act]')) { const s = t.dataset.act, i = s.indexOf(':'); const a = i < 0 ? s : s.slice(0, i); if (ACT[a]) ACT[a](i < 0 ? '' : s.slice(i + 1), t, e); return; }
  onCalcInput(e);
});
document.addEventListener('input', e => { if (e.target.closest('#calc-in') && e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') onCalcInput(e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); else if (!$('#onb').hidden) endOnb(); }
  if (e.key === 'Enter' && !$('#sheet').hidden && e.target.tagName === 'INPUT') { e.preventDefault(); ACT.sheetSave(); }
});

/* ===================== render ===================== */
const TABS = [['hoje', 'Hoje', ICON.home], ['diario', 'Diário', ICON.pen], ['mes', 'Mês', ICON.cal], ['plano', 'Plano', ICON.chart], ['mais', 'Mais', ICON.more]];
function renderTabs(){ $('#tabbar').innerHTML = `<nav>${TABS.map(t => `<button data-act="tab:${t[0]}" class="${UI.tab === t[0] ? 'on' : ''}" aria-current="${UI.tab === t[0] ? 'page' : 'false'}">${t[2]}<span>${t[1]}</span></button>`).join('')}</nav>`; }
function render(){
  renderTabs();
  const app = $('#app');
  if (!S.ready) { app.innerHTML = '<div class="loading">Carregando seus dados…</div>'; return; }
  CH = {}; chartSeq = 0;
  let h = '';
  try {
    h = UI.tab === 'hoje' ? viewHoje() : UI.tab === 'diario' ? viewDiario() : UI.tab === 'mes' ? viewMes() : UI.tab === 'plano' ? viewPlano() : viewMais();
  } catch (e) { console.error(e); h = header('Ops') + `<section><div class="note">Algo deu errado ao montar esta tela: ${esc(e.message)}. Confira as Premissas ou restaure um backup.</div><div class="btns" style="margin-top:10px"><button class="btn tint" data-act="goSub:premissas">Abrir Premissas</button></div></section>`; }
  const y = window.scrollY;
  const active = document.activeElement && document.activeElement.id && app.contains(document.activeElement) ? document.activeElement.id : null;
  app.innerHTML = h;
  drawCharts();
  window.scrollTo(0, y);
  if (active) { const el = document.getElementById(active); if (el) el.focus(); }
}
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(drawCharts, 150); });
render();
initStore();
</script>
